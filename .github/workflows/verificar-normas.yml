name: Verificar vigencia de normas

on:
  schedule:
    # Lunes 13:00 UTC = 7:00 AM Guadalajara
    - cron: '0 13 * * 1'
  workflow_dispatch:  # permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install anthropic requests

      - name: Verificar normas
        env:
          SUPABASE_URL: https://tdxkvvmdxnbarjsaknse.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python robot/verificar_normas.py
