name: Build RRHH App

on:
  push:
    paths:
      - 'rrhh/**'
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: rrhh/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: rrhh

      - name: Build
        run: npm run build
        working-directory: rrhh

      - name: Commit built files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rrhh-app/
          git diff --cached --quiet || git commit -m "ci: rebuild rrhh-app [skip ci]"
          git push
